name: Gerar APK Pick Fácil

on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Descompactar projeto
        shell: bash
        run: |
          set -e
          mkdir -p projeto
          ZIP=$(find . -maxdepth 2 -type f -name "PickFacil_SIMKO_v2.2_FINAL.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERRO: ZIP da melhoria não encontrado."
            exit 1
          fi
          echo "ZIP encontrado: $ZIP"
          unzip -q "$ZIP" -d projeto
          echo "Projeto descompactado:"
          find projeto -maxdepth 3 -type f | head -50

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e
          GRADLE_FILE=$(find projeto -type f -name "build.gradle" | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERRO: build.gradle não encontrado."
            exit 1
          fi

          ROOT=$(dirname "$GRADLE_FILE")
          while [ "$ROOT" != "." ] && [ ! -f "$ROOT/settings.gradle" ] && [ ! -f "$ROOT/settings.gradle.kts" ]; do
            ROOT=$(dirname "$ROOT")
          done

          if [ "$ROOT" = "." ]; then
            ROOT=$(dirname "$GRADLE_FILE")
          fi

          echo "Diretório do projeto: $ROOT"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Localizar APK
        shell: bash
        run: |
          set -e
          APK=$(find "$PROJECT_ROOT" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado: $APK"
          mkdir -p apk_final
          cp "$APK" apk_final/PickFacil-Melhoria.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: PickFacil-APK
          path: apk_final/PickFacil-Melhoria.apk
